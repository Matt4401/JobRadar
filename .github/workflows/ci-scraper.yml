name: Scraper Module CI

on:
  workflow_call:

jobs:
  check-scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Format Check
        run: cargo fmt --package scraper --check

      - name: Clippy Linter
        run: cargo clippy --package scraper --all-targets -- -D warnings

      - name: Run Tests
        run: cargo test --package scraper